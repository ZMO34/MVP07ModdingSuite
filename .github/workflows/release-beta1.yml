name: Build beta1 release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-beta1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependency
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name MVP07ModdingSuite-beta1 --paths src run_editor.py

      - name: Assemble tester package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist\MVP07ModdingSuite-beta1.exe release\MVP07ModdingSuite-beta1.exe
          Copy-Item README.md release\README.md
          Copy-Item BETA1_RELEASE_NOTES.md release\BETA1_RELEASE_NOTES.md
          Copy-Item requirements.txt release\requirements.txt
          @"
          MVP 07 Modding Suite beta1

          Windows packaged build:
          - Run MVP07ModdingSuite-beta1.exe
          - No separate Python installation is required.
          - Python and Tkinter runtime components are bundled into the executable.

          Source build requirements:
          - Python 3.10+
          - Tkinter
          - No third-party runtime Python packages

          Some Linux distributions require installing python3-tk.
          "@ | Set-Content -Encoding UTF8 release\DEPENDENCIES.txt

          Compress-Archive -Path release\* -DestinationPath MVP07ModdingSuite-beta1-Windows-x64.zip -Force

      - name: Create beta1 prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "beta1"
          $title = "beta1"
          $exe = "dist\MVP07ModdingSuite-beta1.exe"
          $zip = "MVP07ModdingSuite-beta1-Windows-x64.zip"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title $title --notes-file BETA1_RELEASE_NOTES.md --prerelease
            gh release upload $tag $exe $zip --clobber
          } else {
            gh release create $tag $exe $zip --target "${{ github.sha }}" --title $title --notes-file BETA1_RELEASE_NOTES.md --prerelease
          }
